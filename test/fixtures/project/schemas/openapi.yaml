openapi: 3.1.0
info:
  title: Cadastro de empresas
  version: 1.0.0
components:
  schemas:
    Empresa:
      type: object
      properties:
        cnpj:
          type: integer
          format: int64
          description: CNPJ da empresa
        razaoSocial:
          type: string
        quantidadeFiliais:
          type: integer
        cnpjTexto:
          type: string
          pattern: '^[0-9A-Z]{12}[0-9]{2}$'
