<!doctype html>
<html lang="pt-BR">
  <body>
    <form>
      <label for="cnpj">CNPJ</label>
      <input type="number" id="cnpj" name="cnpj" />
      <input id="telefone" name="telefone" inputmode="numeric" />
      <input id="cnpj-fornecedor" placeholder="00.000.000/0000-00" />
      <input
        name="cpf_cnpj"
        pattern="\d{11,14}"
        required
      />
    </form>
  </body>
</html>
